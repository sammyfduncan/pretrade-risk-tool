# HISTORICAL FROZEN H4 configuration — silver.
# The active redesign is H1 context + M30 decisions, with M15 optional; see
# docs/archive/intraday_rebuild_plan.md. Documentation moved first. Do not mutate this
# transfer-control config into the intraday version.
# TRANSFERABILITY TEST: identical to gold.yaml apart from the asset identity.
# Do not tune this file — its purpose is to show whether the gold template
# generalizes untouched. Divergent results here mean the template is really a
# gold-shaped artifact.
# Adding a new asset later = copy this file and change its asset identifiers.
#
# Step 2 widened "asset identity" from three lines to five. The alt-data layer
# needs two more identifiers that cannot be inherited — the CFTC contract code
# and the GDELT query — because each one *names this asset* in an external
# dataset. They are identity, not tuning: no window, threshold, lag or gate in
# this file differs from gold's, and none may be adjusted to improve a silver
# result. See docs/archive/step2_design.md §4.1 for the query's validation record.

asset: silver
symbol: XAGUSD
granularity: H4            # frozen historical value, not the active target cadence

data:
  source: dukascopy        # dukascopy (deep research history) | oanda (bounded broker parity/execution)
  start: "2019-01-01"
  # end omitted -> now

  # Fenced off on 2026-07-28, after the first two runs had already informed the
  # label/timeframe/feature choices. The H4 strategy was retired without reading
  # it; intraday plan §2.6 reassigns this unread window once as the frozen
  # intraday historical confirmation period. It may not be used for tuning.
  holdout_start: "2025-07-01"

  dukascopy:
    instrument: "XAG/USD"
    offer_side: bid        # bid | ask. Spread cost is modeled separately via backtest.fee_pct.

  oanda:
    # Verified against the authenticated v20 practice account on 2026-08-04.
    # Minimum size, unit precision, margin and GBP conversion remain live API
    # facts; they are never copied into this research configuration.
    instrument: XAG_USD
    account_type: SPREADBET

features:
  technical: true          # price-path indicators — strong on volatility, weak on direction
  macro: true              # FRED real yields / dollar / VIX — the directional candidates
  crossasset: true         # gold/silver ratio — regime, not direction

  # Step-2 alt-data (docs/archive/step2_design.md). Both OFF again as of 2026-07-30:
  # the pre-registered §6 retention gate FAILED on 4 of 4 combinations (§9).
  # Neither family adds directional information — every observed AUC delta on
  # gold was negative, and silver's one positive (+0.0198, 5/5 folds) lost to
  # the max of 20 time-shifted placebos. The snapshots stay on disk so the
  # result is reproducible; the features stay off.
  #
  # Turning either back on is a NEW pre-registered experiment, not a revert.
  # Run 7 retired both COT and GDELT-attention for volatility too. The surviving
  # historical sizing candidates were GVZ (gold) and the scheduled-event
  # calendar; both require a new intraday gate before use.
  cot: false               # CFTC COT positioning — crowdedness, contrarian hypothesis
  gdelt: false             # GDELT news tone/attention — safe-haven hypothesis

crossasset:
  # Same block in every metal's config on purpose: the ratio describes the
  # environment both metals sit in, not the asset being modeled. Needs the
  # other leg's candles on disk (scripts/fetch_data.py --config config/gold.yaml).
  numerator_symbol: XAUUSD
  denominator_symbol: XAGUSD

cot:
  # CFTC Disaggregated Futures-Only, cftc_contract_market_code for this asset.
  # "SILVER - COMMODITY EXCHANGE INC." — verified live against the API
  # 2026-07-29, current through the 2026-07-21 report. There is deliberately no
  # default: inheriting gold's 088691 here would train silver on gold's
  # positioning, silently and plausibly. Release schedule / lags are constants
  # in features/cot.py and are CFTC-wide, so they are shared with gold — the
  # Feb-2023 ION outage blanks the same bars on both assets.
  contract_code: "084691"

gdelt:
  # VALIDATED 2026-07-29; record in docs/archive/step2_design.md §4.1. 0/720 titles
  # contaminated across five windows (no Nate Silver, no Adam Silver, no
  # Silver Lake, no silver linings), AND the positive control fired — the
  # Jan/Feb 2021 window returned the retail silver-squeeze coverage, so the
  # list is neither too broad nor too narrow. Both failure directions tested,
  # which a contamination grep alone cannot do.
  #
  # Exactly parallel to gold's list — same four phrase shapes, differing only
  # in the metal's name. Under the BigQuery/headline mechanism there is no
  # longer any reason for the two to differ structurally, which makes silver a
  # cleaner transferability control than it was under DOC 2.0 (§6.1).
  #
  # KNOWN CONFOUND, measured 2026-07-29 before any outcome was read. On the
  # full pinned snapshot: median 7.0 stories/day for silver against 28.0 for
  # gold, and 137 zero-story days against 17. (A 2022-only preview sample had
  # said 5.3 vs 20.9 — same 4x ratio.) Silver's daily mean tone is therefore
  # ~2x noisier by sampling alone. §1.1 already predicted a weaker silver
  # GDELT result for a MECHANISM reason (industrial demand offsets monetary
  # fear); density predicts the same thing for a boring measurement reason.
  # The two are confounded, and the features were deliberately NOT changed to
  # paper over it — see §1.1a for the three repairs considered and rejected.
  title_phrases:
    - "silver price"
    - "price of silver"
    - "silver futures"
    - "silver bullion"

primary:
  # The rule that picks direction under label.mode: meta. See primary.py — the
  # model never chooses a side, it only decides whether to obey this rule.
  rule: trend              # trend | breakout | always
  ema_span: 50
  lookback: 20

label:
  # Symmetric triple barrier: take-profit at +atr_mult*ATR, stop at -atr_mult*ATR,
  # give up after horizon_bars. Symmetry is the point — it removes the volatility
  # channel that contaminated the old long_threshold label (see labels.py).
  mode: meta               # meta | triple_barrier | updown | long_threshold (legacy)
  horizon_bars: 12         # 12 H4 bars = 2 trading days
  atr_mult: 1.5            # barrier width in ATRs; must clear costs to be tradeable
  timeout: sign            # sign (label by direction at horizon) | drop

cv:
  n_splits: 5
  gap_bars: 12             # MUST be >= label.horizon_bars (prevents label-overlap leakage)

model:
  type: lightgbm           # lightgbm | logistic (baseline)
  # Still no hyperparameter tuning: the logistic baseline beat LightGBM on the
  # first run, which means the bottleneck is information, not model capacity.

  # Overlapping forward labels make consecutive rows near-duplicates, so the
  # model counts one move as up to horizon_bars independent facts. Weighting by
  # label uniqueness corrects that at the source. Expect metrics to get
  # slightly WORSE and more honest — this removes flattery, it adds no signal.
  sample_weighting: uniqueness   # none | uniqueness

  # Makes the probability mean what it says. Raw Brier 0.3035 against a 0.2496
  # no-skill baseline; isotonic closes ~80% of that gap.
  #
  # Chosen on Brier alone, which is calibration's own job. Ranking is unaffected
  # because entries use the RAW score (see walkforward.WalkForwardResult) —
  # isotonic flattens regions where the score does not discriminate, which is
  # informative but would otherwise have moved the trade count by ~50% for
  # reasons unrelated to signal. Isotonic is also the safer of the two here:
  # Platt is an unconstrained fit and tried to invert folds where the model
  # scored below chance.
  calibration: isotonic          # none | isotonic | sigmoid

backtest:
  # HISTORICAL IMPLEMENTATION CAVEAT: labels inspect high/low from the signal
  # close, while the current vectorbt call uses close only and re-anchors stops
  # at the delayed entry. P&L is provisional until the intraday rebuild aligns
  # the contract. The quantile mechanics below remain the frozen H4 values.
  entry_quantile: 0.90     # go long on the top decile of predictions
  fee_pct: 0.0001          # ~half-spread per side as a fraction
  init_cash: 10000
