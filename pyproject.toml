[project]
name = "commodity-ml"
version = "0.1.0"
description = "Multi-commodity ML + sentiment rotation trading system (step 1: gold price-ML pipeline)"
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
